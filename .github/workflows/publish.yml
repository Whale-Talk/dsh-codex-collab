name: Publish to npm

on:
  # 打 tag 即发布：v0.1.0 -> 0.1.0
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  # 也支持手动触发重发 / 预演
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做 pack 校验，不真正发布'
        type: boolean
        default: true
      check_auth:
        description: '只读检查 NPM_TOKEN 是否有效，不上传包'
        type: boolean
        default: false
      publish_alias:
        description: '发布无 scope 别名 dsh-codex-collab（不随 tag 自动发布）'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # provenance 签名需要

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check npm authentication (read only)
        if: github.event_name == 'push' || inputs.check_auth
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured"
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Syntax-check every shipped module
        run: |
          set -euo pipefail
          for f in harness/*.mjs mcp/*.mjs \
                   codex-plugin/plugins/dsh/skills/dsh-collab/scripts/*.mjs; do
            node --check "$f"
            echo "ok  $f"
          done

      - name: Package contract
        run: |
          set -euo pipefail
          node -e '
            const p = require("./package.json");
            const need = [
              "package.json", "cordis.patch.yml", "README.md", "LICENSE",
              "harness/dsh-bridge.mjs", "mcp/dsh-mcp.mjs",
              "codex-plugin/plugins/dsh/skills/dsh-collab/SKILL.md",
            ];
            if (p.name !== "@whaletalk/dsh-codex-collab") throw new Error("unexpected name: " + p.name);
            if (p.publishConfig?.access !== "public") throw new Error("publishConfig.access must be public");
            if (!p.dsh?.bundle?.patch) throw new Error("missing dsh.bundle.patch");
            for (const b of Object.keys(p.bin || {})) {
              if (!p.bin[b].startsWith("./")) throw new Error("bin path must be relative: " + b);
            }
            console.log("contract ok:", p.name, p.version);
          '

      - name: Pack and assert tarball contents
        run: |
          set -euo pipefail
          npm pack --json > pack.json
          node -e '
            const meta = require("./pack.json")[0];
            const paths = new Set(meta.files.map(f => f.path.replace(/^package\//, "")));
            const need = [
              "package.json", "cordis.patch.yml", "README.md", "LICENSE",
              "harness/dsh-bridge.mjs", "mcp/dsh-mcp.mjs",
              "codex-plugin/plugins/dsh/skills/dsh-collab/SKILL.md",
              "codex-plugin/plugins/dsh/.codex-plugin/plugin.json",
            ];
            const missing = need.filter(n => !paths.has(n));
            if (missing.length) throw new Error("tarball missing: " + missing.join(", "));
            if (paths.has("dsh-banner.png.png") === false) throw new Error("README banner missing from tarball");
            console.log("tarball ok:", meta.filename, meta.entryCount + " entries",
                        (meta.unpackedSize / 1024).toFixed(0) + " KiB unpacked");
          '

      - name: Install the tarball and smoke-test the CLIs
        run: |
          set -euo pipefail
          TGZ=$(node -p 'require("./pack.json")[0].filename')
          rm -rf "$RUNNER_TEMP/smoke"
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ"
          echo "--- installed bin links ---"
          ls -l node_modules/.bin/
          for b in dsh-mcp dsh-task dsh-review; do
            [ -e "node_modules/.bin/$b" ] || { echo "::error::missing bin shim: $b"; exit 1; }
          done
          PKG=node_modules/@whaletalk/dsh-codex-collab
          echo "--- dsh-mcp: initialize handshake over stdio ---"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node "$PKG/mcp/dsh-mcp.mjs" 2>/dev/null \
            | tee handshake.jsonl \
            | node -e '
              let buf = "";
              process.stdin.on("data", d => buf += d).on("end", () => {
                const lines = buf.trim().split("\n").filter(Boolean).map(JSON.parse);
                const init = lines.find(l => l.id === 1);
                const list = lines.find(l => l.id === 2);
                if (!init?.result?.serverInfo) throw new Error("initialize failed: " + buf);
                const names = (list?.result?.tools || []).map(t => t.name).sort();
                const want = ["dsh_read_file","dsh_review","dsh_task","dsh_task_cancel","dsh_task_status"];
                if (JSON.stringify(names) !== JSON.stringify(want)) {
                  throw new Error("tool set mismatch: " + JSON.stringify(names));
                }
                console.log("mcp ok:", init.result.serverInfo.name, init.result.serverInfo.version, names.join(","));
              });
            '
          echo "--- dsh-task: --list must not crash when no gateway is up ---"
          node "$PKG/codex-plugin/plugins/dsh/skills/dsh-collab/scripts/task.mjs" --list || true
          echo "--- dsh-review: --help style usage output ---"
          node "$PKG/codex-plugin/plugins/dsh/skills/dsh-collab/scripts/review.mjs" --cwd "$(pwd)" || true

      - name: Bridge plugin exports the Cordis contract
        # `@deepseek-ai/dsh-tools` is an OPTIONAL peer supplied by the DSH profile
        # at runtime, never by npm — so importing the bridge straight out of
        # node_modules would fail here for a reason that does not affect real
        # installs. Stub the peer to assert the module's own export shape.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smoke"
          mkdir -p node_modules/@deepseek-ai/dsh-tools
          cat > node_modules/@deepseek-ai/dsh-tools/package.json <<'JSON'
          { "name": "@deepseek-ai/dsh-tools", "version": "0.0.0-stub", "type": "module",
            "main": "./index.mjs" }
          JSON
          cat > node_modules/@deepseek-ai/dsh-tools/index.mjs <<'JS'
          export const defineTool = (spec) => spec
          JS
          node --input-type=module -e '
            import { pathToFileURL } from "node:url";
            const url = pathToFileURL(process.cwd() + "/node_modules/@whaletalk/dsh-codex-collab/harness/dsh-bridge.mjs").href;
            const mod = await import(url);
            if (mod.name !== "dsh-bridge") throw new Error("bad plugin name: " + mod.name);
            if (typeof mod.apply !== "function") throw new Error("apply() missing");
            const need = ["webServer", "agents", "subagents", "tools"];
            for (const k of need) {
              if (!mod.inject.includes(k)) throw new Error("inject missing " + k);
            }
            console.log("bridge ok:", mod.name, "inject=[" + mod.inject.join(",") + "]");
          '

      - name: Bundle patch points at the packaged subpath
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = require("./package.json");
            const patch = fs.readFileSync(p.dsh.bundle.patch, "utf8");
            const sub = "@whaletalk/dsh-codex-collab/bridge";
            if (!p.exports["./bridge"]) throw new Error("exports must expose ./bridge");
            // Inspect resolved rows only — prose in comments may quote the old
            // profile-relative form, so a naive substring check false-positives.
            const rows = patch.split("\n").filter(l => /^\s*name:/.test(l));
            if (!rows.length) throw new Error("patch declares no plugin rows");
            for (const row of rows) {
              if (!row.includes(sub)) throw new Error("row not on the packaged subpath: " + row.trim());
            }
            if (!patch.includes("- id: dsh-bridge")) throw new Error("row id must be dsh-bridge");
            console.log("patch ok:", rows.length, "row(s) on", sub);
          '

      - name: 'Unscoped alias: manifest, patch row and re-export contract'
        # `alias/dsh-codex-collab` is a thin forwarding package: DSH's client
        # install box takes a bare name, and pnpm links only direct profile
        # dependencies at the node_modules root, so the alias must route the
        # row at ITS OWN subpath and re-export the real bridge from there.
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/alias-check.mjs" <<'JS'
          import fs from 'node:fs'
          const dir = 'alias/dsh-codex-collab'
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const alias = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8'))
          const fail = (m) => { throw new Error(m) }
          if (alias.name !== 'dsh-codex-collab') fail('alias name: ' + alias.name)
          if (alias.version !== root.version) fail('alias version ' + alias.version + ' must track root ' + root.version)
          if (alias.dsh?.bundle?.patch !== './cordis.patch.yml') fail('alias must declare dsh.bundle.patch')
          if (alias.publishConfig?.access !== 'public') fail('alias publishConfig.access must be public')
          const dep = (alias.dependencies || {})['@whaletalk/dsh-codex-collab']
          if (dep !== '^' + root.version) fail('alias must depend on ^' + root.version + ', got ' + dep)
          const patch = fs.readFileSync(dir + '/cordis.patch.yml', 'utf8')
          const rows = patch.split('\n').filter((l) => /^\s*name:/.test(l))
          if (rows.length !== 1) fail('alias patch must declare exactly one row, got ' + rows.length)
          if (!rows[0].includes("'dsh-codex-collab/bridge'")) fail('alias row must name its own subpath: ' + rows[0].trim())
          const bridge = fs.readFileSync(dir + '/bridge.mjs', 'utf8')
          if (!bridge.includes("export * from '@whaletalk/dsh-codex-collab/bridge'")) {
            fail('alias bridge must re-export the scoped bridge')
          }
          for (const f of ['bridge.mjs', 'cordis.patch.yml', 'README.md', 'LICENSE']) {
            if (!fs.existsSync(dir + '/' + f)) fail('alias ships no ' + f)
          }
          console.log('alias ok:', alias.name + '@' + alias.version, '->', dep)
          JS
          node "$RUNNER_TEMP/alias-check.mjs"

      - name: 'Unscoped alias: tarball carries the patch and the re-export'
        run: |
          set -euo pipefail
          cd alias/dsh-codex-collab
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/alias-pack.json"
          cat > "$RUNNER_TEMP/alias-pack-check.mjs" <<'JS'
          import fs from 'node:fs'
          const meta = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/alias-pack.json', 'utf8'))[0]
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const paths = new Set(meta.files.map((f) => f.path.replace(/^package\//, '')))
          const need = ['package.json', 'cordis.patch.yml', 'bridge.mjs', 'README.md', 'LICENSE']
          const missing = need.filter((n) => !paths.has(n))
          if (missing.length) throw new Error('alias tarball missing: ' + missing.join(', '))
          if (meta.name !== pkg.name || meta.version !== pkg.version) {
            throw new Error('unexpected alias pack: ' + meta.name + '@' + meta.version)
          }
          console.log('alias tarball ok:', meta.filename, meta.entryCount + ' entries')
          JS
          node "$RUNNER_TEMP/alias-pack-check.mjs"

  publish:
    name: Publish
    needs: verify
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG != package version $VER"
            exit 1
          fi
          echo "tag/version aligned: $VER"

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-alias:
    name: Publish unscoped alias
    needs: verify
    # 别名只在手动派发时发布（tag 推送不触发），避免与真身版本错位；
    # 版本锁步由 verify 与下面的断言共同保证。
    if: inputs.publish_alias
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Assert alias version tracks the root package
        working-directory: alias/dsh-codex-collab
        run: |
          set -euo pipefail
          ALIAS=$(node -p 'require("./package.json").version')
          ROOT=$(node -p 'require("../../package.json").version')
          if [ "$ALIAS" != "$ROOT" ]; then
            echo "::error::alias version $ALIAS != root version $ROOT"
            exit 1
          fi
          echo "alias/root versions aligned: $ALIAS"

      - name: Publish dsh-codex-collab with provenance
        working-directory: alias/dsh-codex-collab
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
