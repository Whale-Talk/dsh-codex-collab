# dsh-codex-collab —— 无 scope 别名组合包。
#
# 这里只挂一行，指向**别名自己的子路径** `dsh-codex-collab/bridge`。
# 为什么不直接写 `@whaletalk/dsh-codex-collab/bridge`：pnpm 只把直接依赖链接到
# profile 的 node_modules 根目录，真实实现在别名的 node_modules 里是嵌套的，
# 从 profile 根解析不到那个名字；由别名自己的子路径转发才解析得到。
# 见 bridge.mjs —— 它只是 `export * from '@whaletalk/dsh-codex-collab/bridge'`。
#
# 行为与真实包完全一致（同一份代码、同一个行 id dsh-bridge），两者装其一即可。
- insert:
    - id: dsh-bridge
      name: 'dsh-codex-collab/bridge'
