# DSH Collab bundle layer —— Codex → DSH 派活（dsh-bridge）。
#
# 安装（npm）：
#   dsh plugin --profile desktop add @whaletalk/dsh-codex-collab
# `dsh plugin add` 会把本包加入 profile 的 dsh.profile.bundles，并自动套用本 patch。
#
# 本 bundle 只插一行：
#
#   dsh-bridge —— 宿主网关插件（Codex → DSH 的派活通道）
#   - id  行 id；用户的 patch 层可用同 id 覆盖整段 config。
#   - name 用包子路径而非相对路径（对比 './dsh-bridge.mjs'）：只有这样从 npm 安装
#     后解析器才能定位到包内文件，同时保持 profile 目录干净。
#   依赖的服务：webServer / agents / subagents / tools 四个注入，加上运行时取用的
#   timer、sessionQuery、agentPresets、sessionPersistence、workspaceRegistry、llm。
#   其中 webServer 由 dsh-web-app 提供 —— 因此本 bundle 只能挂 web / desktop
#   profile，headless profile 没有该服务会一直 pending。
#   本插件不使用 workflowEngine，所以 web GUI 默认禁用 workflow 引擎不影响它。
#
# 反向通道（DSH → Codex）自 0.1.12 起不再默认内置：
#   Codex CLI 0.167 移除了 `codex mcp-server`，旧配置只会静默启动失败。
#   新版本请改用 DSH 官方 @deepseek-ai/dsh-subagent-codex（工具 subagent_codex）；
#   仍需旧反向通道（仅 Codex CLI ≤ 0.1xx 且仍带 `codex mcp-server`）的用户，
#   把 templates/codex-mcp/cordis.patch.yml 里的 codex-mcp insert 行合并进
#   profile 的 cordis.patch.yml 即可（不要覆盖整个文件）。
- insert:
    - id: dsh-bridge
      name: '@whaletalk/dsh-codex-collab/bridge'
